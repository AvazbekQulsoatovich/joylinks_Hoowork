name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- DIRECTORY LISTING ---"
            ls -la /home/webdevaj
            echo "--- ACTIVE SYSTEMD SERVICES ---"
            systemctl list-units --type=service | grep -E "joylinks|hoowork|gunicorn"
            echo "--- NGINX CONFIGURATION ---"
            ls -la /etc/nginx/sites-enabled
            sudo cat /etc/nginx/sites-enabled/* | grep -C 5 "proxy_pass"
            echo "--- SERVICE STATUS ---"
            sudo systemctl status joylinks || true
            sudo journalctl -u joylinks -n 20 --no-pager || true
